---
# HTTP -> HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.{{ index .Values "kube-prometheus-stack" "grafana" "grafana.ini" "server" "domain" }}`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTPS with TLS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.{{ index .Values "kube-prometheus-stack" "grafana" "grafana.ini" "server" "domain" }}`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    certResolver: stepca
