step-certificates:
  # Let the chart bootstrap its own PKI
  # Only inject config to add ACME provisioner
  inject:
    enabled: true
    config:
      files:
        ca.json:
          root: /home/step/certs/root_ca.crt
          federateRoots: []
          crt: /home/step/certs/intermediate_ca.crt
          key: /home/step/secrets/intermediate_ca_key
          address: :9000
          dnsNames:
            - step-ca-step-certificates.traefik.svc.cluster.local
          logger:
            format: json
          db:
            type: badgerv2
            dataSource: /home/step/db
          authority:
            enableAdmin: false
            provisioners:
              - {"type": "ACME", "name": "acme"}
          tls:
            cipherSuites:
              - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
              - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
            minVersion: 1.2
            maxVersion: 1.3
            renegotiation: false
        defaults.json:
          ca-url: https://step-ca-step-certificates.traefik.svc.cluster.local
          ca-config: /home/step/config/ca.json
          root: /home/step/certs/root_ca.crt
