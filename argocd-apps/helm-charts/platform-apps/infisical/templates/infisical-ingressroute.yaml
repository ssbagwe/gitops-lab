---
# HTTP -> HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infisical-http
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`infisical.{{ .Values.infisical.domain }}`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: {{ .Release.Name }}
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HTTPS with TLS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infisical
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`infisical.{{ .Values.infisical.domain }}`)
      kind: Rule
      services:
        - name: {{ .Release.Name }}
          port: 8080
  tls:
    certResolver: stepca
