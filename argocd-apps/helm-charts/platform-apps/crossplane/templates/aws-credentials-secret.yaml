{{- if .Values.providerConfig.aws.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.providerConfig.aws.credentials.secretRef.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
stringData:
  {{ .Values.providerConfig.aws.credentials.secretRef.key }}: |
    [default]
    aws_access_key_id =
    aws_secret_access_key =
{{- end }}
