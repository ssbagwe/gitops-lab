---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: platform-apps
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 39.0.1
    chart: traefik
    helm:
      values: |
        # Schedule on worker node with ingress port mappings
        nodeSelector:
          ingress-ready: "true"
        # Use Kind's port-mapping
        service:
          type: NodePort
        # Use hostPort to bind directly to Kind's mapped ports
        ports:
          web:
            hostPort: 80
          websecure:
            hostPort: 443
        # Single replica for local dev
        deployment:
          replicas: 1
        # Enable dashboard for learning/debugging
        ingressRoute:
          dashboard:
            enabled: true
            entryPoints:
              - web
              - websecure
        # ACME certificate resolver using step-ca as private CA
        certificatesResolvers:
          stepca:
            acme:
              caServer: https://step-ca-step-certificates.step-ca.svc.cluster.local/acme/acme/directory
              caBundle: /step-ca-certs/root_ca.crt
              storage: /data/acme.json
              httpChallenge:
                entryPoint: web
        # Persist ACME state across restarts
        persistence:
          enabled: true
          size: 128Mi
          path: /data
        # Trust step-ca root CA (mirrored from step-ca namespace via Reflector)
        volumes:
          - name: step-ca-root-ca
            mountPath: /step-ca-certs
            type: configMap
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
