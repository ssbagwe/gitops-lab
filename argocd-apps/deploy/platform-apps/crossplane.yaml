---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: aws-credentials
      jsonPointers:
        - /data
        - /stringData
  project: platform-apps
  source:
    repoURL: https://github.com/ssbagwe/gitops-lab
    targetRevision: main
    path: argocd-apps/helm-charts/platform-apps/crossplane
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
